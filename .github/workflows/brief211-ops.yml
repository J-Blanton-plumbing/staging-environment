# Brief 211 — Track C live-box ops (2026-10-15): www/http → https apex in ONE hop, in nginx.
#
# Same vehicle as Brief 150 (ops/brief-150): the live box is reachable only over the deploy
# SSH secrets, a workflow_dispatch-only workflow off the default branch never registers, and
# merging to main would fire deploy.yml. So: push to THIS branch, phase chosen by a
# commit-message marker — [phase:inspect] (read-only) or [phase:apply] (backup → edit →
# nginx -t → reload, auto-rollback on any failure). A push with neither marker runs nothing.
#
# ⚠️ This repo is PUBLIC, so these logs are public. nginx config holds no secret VALUES
# (certificate/key lines are file PATHS), but any line mentioning password/secret/token is
# redacted anyway. Staging blocks (staging., staging2., default _) are never edited.
name: Brief 211 — Live-box ops (nginx host canonicalization)

on:
  push:
    branches: [ops/brief-211]

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect (read-only)
        if: ${{ contains(github.event.head_commit.message, '[phase:inspect]') }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            set +e
            exec 2>&1
            echo '=== nginx -v / layout ==='
            sudo nginx -v
            ls -la /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>&1
            echo '=== nginx -T (redacted) ==='
            sudo nginx -T 2>&1 | grep -viE 'password|secret|token' 
            echo '=== certificate SANs ==='
            for c in $(sudo nginx -T 2>/dev/null | grep -E '^\s*ssl_certificate\s' | awk '{print $2}' | tr -d ';' | sort -u); do
              echo "--- $c"; sudo openssl x509 -in "$c" -noout -subject -enddate -ext subjectAltName 2>&1
            done
            echo '=== certbot ==='
            sudo certbot certificates 2>&1 | grep -E 'Certificate Name|Domains|Expiry|Path'
            echo '=== existing backups ==='
            ls -la /etc/nginx/*.bak* /etc/nginx/sites-available/*.bak* /var/backups/nginx* 2>&1
            echo 'INSPECT DONE'

      # Live-DB link scan (Track B.3) — READ-ONLY. Prints table.column, row ctid and the matched
      # /{x}/plumbing-services links only. Report, never rewrite.
      - name: Live DB scan for stored /plumbing-services links (read-only)
        if: ${{ contains(github.event.head_commit.message, '[phase:dbscan]') }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            set +e
            exec 2>&1
            cd /var/www/jblanton || exit 0
            cat > /tmp/b211-dbscan.js <<'JS'
            const { Client } = require('/var/www/jblanton/node_modules/pg');
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL }); await c.connect();
              const cols = (await c.query("SELECT table_name, column_name FROM information_schema.columns WHERE table_schema='public' AND data_type IN ('text','character varying','jsonb','json')")).rows;
              const re = /(?:https?:\/\/(?:www\.)?jblantonplumbing\.com)?\/[a-z0-9-]+\/plumbing-services(?![a-z0-9-])/gi;
              let n = 0;
              for (const { table_name: t, column_name: col } of cols) {
                const r = await c.query('SELECT ctid::text AS id, "' + col + '"::text AS v FROM "' + t + '" WHERE "' + col + '"::text ILIKE \'%/plumbing-services%\'').catch(() => ({ rows: [] }));
                for (const row of r.rows) {
                  const m = row.v.match(re) || [];
                  if (!m.length) continue;
                  n++; console.log('HIT', t + '.' + col, row.id, JSON.stringify([...new Set(m)]));
                }
              }
              console.log('DBSCAN DONE', n, 'row(s) with links;', cols.length, 'text columns scanned');
              await c.end();
            })().catch(e => console.log('DBSCAN ERROR', e.message));
            JS
            set -a; . ./.env.local; set +a
            node /tmp/b211-dbscan.js
            rm -f /tmp/b211-dbscan.js

      # Track C apply. Minimal diff to /etc/nginx/conf.d/production.conf:
      #   1. the 443 block keeps ONLY the apex in server_name (it stays first in the file, so it
      #      stays the default 443 server for unknown hosts, exactly as today);
      #   2. a new 443 block for www, same certificate (its SAN covers www), 301 → apex;
      #   3. the port-80 www branch goes straight to https://jblantonplumbing.com (was https://www).
      # Unknown hosts on :80 still get the same 404, the apex :80 branch is untouched, and
      # staging.conf / staging2.conf / nginx.conf's default `_` block are not edited.
      # Any failure (nginx -t, reload, on-box self-test) restores the backup and reloads.
      - name: Apply www → apex (phase apply)
        if: ${{ contains(github.event.head_commit.message, '[phase:apply]') }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            set +e
            exec 2>&1
            CONF=/etc/nginx/conf.d/production.conf
            BDIR=/etc/nginx/backup-brief211
            TS=$(date -u +%Y%m%dT%H%M%SZ)
            BAK=$BDIR/production.conf.$TS
            if sudo grep -q 'Brief 211' $CONF; then echo 'VERDICT: ALREADY-APPLIED'; sudo cat $CONF; exit 0; fi
            sudo mkdir -p $BDIR && sudo cp -p $CONF $BAK || { echo 'VERDICT: ABORT (backup failed, nothing changed)'; exit 0; }
            echo "backup: $BAK"
            cat > /tmp/b211-production.conf <<'NGINX'
            # Brief 211 (2026-10-15): www.jblantonplumbing.com is split out of the apex block.
            # www -> apex is done HERE, in nginx. Do NOT add www back to the apex server_name.
            server {
                server_name jblantonplumbing.com;
                client_max_body_size 64M;
                location /uploads/cms/ {
                    root /var/www/jblanton/public;
                    try_files $uri =404;
                }
                location / {
                    if ($http_x_middleware_subrequest) { return 403; }
                    proxy_pass http://localhost:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection upgrade;
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }

                listen 443 ssl; # managed by Certbot
                ssl_certificate /etc/letsencrypt/live/jblantonplumbing.com/fullchain.pem; # managed by Certbot
                ssl_certificate_key /etc/letsencrypt/live/jblantonplumbing.com/privkey.pem; # managed by Certbot
                include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
            }

            # Brief 211: https://www.* -> https://jblantonplumbing.com, same path + query, ONE hop.
            # Same certificate as the apex (its SAN lists www.jblantonplumbing.com).
            server {
                server_name www.jblantonplumbing.com;
                listen 443 ssl;
                ssl_certificate /etc/letsencrypt/live/jblantonplumbing.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/jblantonplumbing.com/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 301 https://jblantonplumbing.com$request_uri;
            }

            server {
                # Brief 211: http://www.* goes straight to the https APEX (was https://$host, i.e. www).
                if ($host = www.jblantonplumbing.com) {
                    return 301 https://jblantonplumbing.com$request_uri;
                }
                if ($host = jblantonplumbing.com) {
                    return 301 https://$host$request_uri;
                } # managed by Certbot

                listen 80;
                server_name jblantonplumbing.com www.jblantonplumbing.com;
                return 404; # managed by Certbot
            }
            NGINX
            rollback() {
              echo "ROLLBACK: $1"
              sudo cp -p $BAK $CONF && sudo nginx -t && sudo systemctl reload nginx
              echo "VERDICT: ROLLED-BACK ($1)"
            }
            sudo cp /tmp/b211-production.conf $CONF
            echo '=== diff (backup -> new) ==='
            sudo diff -u $BAK $CONF
            if ! sudo nginx -t; then rollback 'nginx -t failed'; exit 0; fi
            if ! sudo systemctl reload nginx; then rollback 'reload failed'; exit 0; fi
            sleep 2
            echo '=== on-box self-test ==='
            FAIL=0
            chk() {
              got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --resolve "$2" "$1")
              echo "$got  <- $1"
              [ "$got" = "$3 $4" ] || { echo "  EXPECTED: $3 $4"; FAIL=1; }
            }
            chk "https://www.jblantonplumbing.com/" www.jblantonplumbing.com:443:127.0.0.1 301 https://jblantonplumbing.com/
            chk "https://www.jblantonplumbing.com/northbrook" www.jblantonplumbing.com:443:127.0.0.1 301 https://jblantonplumbing.com/northbrook
            chk "http://www.jblantonplumbing.com/mchenry?x=1" www.jblantonplumbing.com:80:127.0.0.1 301 "https://jblantonplumbing.com/mchenry?x=1"
            chk "http://jblantonplumbing.com/" jblantonplumbing.com:80:127.0.0.1 301 https://jblantonplumbing.com/
            chk "https://jblantonplumbing.com/" jblantonplumbing.com:443:127.0.0.1 200 ""
            chk "https://staging.jblantonplumbing.com/robots.txt" staging.jblantonplumbing.com:443:127.0.0.1 200 ""
            if [ $FAIL = 1 ]; then rollback 'self-test failed'; exit 0; fi
            echo "VERDICT: APPLIED (backup $BAK)"
            echo '=== final production.conf ==='
            sudo cat $CONF
            echo '=== certbot renewal facts (read-only) ==='
            sudo grep -E 'authenticator|installer|webroot' /etc/letsencrypt/renewal/jblantonplumbing.com.conf
            systemctl list-timers --all 2>/dev/null | grep -i certbot || echo 'no certbot systemd timer'
            sudo crontab -l 2>/dev/null | grep -i certbot || echo 'no certbot root crontab line'
            ls /etc/cron.d 2>/dev/null | grep -i certbot || echo 'no /etc/cron.d certbot entry'
