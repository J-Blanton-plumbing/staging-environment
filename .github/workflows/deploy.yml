name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            sudo chown -R ec2-user:ec2-user /var/www/jblanton
            cd /var/www/jblanton
            git config --global --add safe.directory /var/www/jblanton
            git fetch origin
            git reset --hard origin/main
            # The rest of the deploy lives in scripts/deploy.sh — see that file's header.
            #
            # ⚠️ KEEP THIS STEP SMALL. `appleboy/ssh-action` sends the whole inline script
            # to the remote shell as ONE command string, and past roughly 42 KB the remote
            # `/bin/bash` rejects it with "Argument list too long" (E2BIG) before running a
            # single line. That killed run #102 on 2026-09-21, in one second, after 26
            # comment lines took the inline script from 42,245 to 43,731 bytes. Anything
            # you are tempted to add here belongs in scripts/deploy.sh instead.
            #
            # Invoked with `bash` rather than `./scripts/deploy.sh` so the deploy does not
            # depend on the executable bit surviving a checkout. The mode bit IS set in git
            # as well; this is belt and braces.
            #
            # `set -e` above governs THIS line and `script_stop: true` injects its own exit
            # check after it, so a non-zero exit from the script fails the step twice over.
            # INSIDE the file, abort-on-failure is `set -e`'s job — see its header.
            bash scripts/deploy.sh

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Brief 151: MUST stay false for this step. With script_stop: true the
          # transport aborts the remote script at the first intermediate
          # non-zero exit — deterministically at check 7, the first
          # check_absent, whose HEALTHY path has grep exit 1 — and drops the
          # output tail, so every deploy went red here even when all 11 checks
          # pass when the same script is run on the box (Brief 150 §8). The
          # script below manages its own `set -e` and exit codes: a genuinely
          # failing check still exits non-zero and turns this step red.
          script_stop: false
          script: |
            set -e
            # Send stderr into stdout. Without this, appleboy/ssh-action prefixes
            # stdout with "out:" and stderr with "err:", and any diagnostic the
            # shell itself emits (a "command not found", an arithmetic error, a
            # curl failure) lands in a stream that is easy to scroll past. This
            # step failed on seven consecutive deploys printing nothing but its
            # successful lines, because the one line naming the cause was on
            # stderr. A verification step that cannot say why it failed is not
            # verification.
            exec 2>&1

            # Brief 153 follow-up: this step is a SEPARATE ssh-action invocation from
            # "Deploy via SSH", so it opens a NEW SSH session starting in $HOME — the
            # `cd /var/www/jblanton` in that step does NOT carry over. Every other
            # repo-script call in this pipeline lives in that step and is therefore
            # already in the app directory; the SEO validator at the bottom of THIS step
            # was the first one that is not, and it died instantly on
            # "Cannot find module '/home/ec2-user/scripts/validate-seo-routing.mjs'",
            # turning two consecutive deploys red for a reason that had nothing to do
            # with the code they shipped (runs 78 and 79).
            #
            # `cd` here rather than on the node line, so any future repo-relative command
            # in this step is correct by default.
            cd /var/www/jblanton

            # Pinpoint reporting. Each check records what it is about to do; if the
            # script dies partway, the EXIT trap names the exact check that was
            # running. Costs no output on success, unlike tracing every check.
            LAST_CHECK="(startup)"
            on_exit() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo ''
                echo "STEP ABORTED with exit ${status} while running: ${LAST_CHECK}"
                echo 'Anything printed immediately above this line is the reason.'
              fi
            }
            trap on_exit EXIT

            sleep 12
            FAILED=0
            for path in "/" "/services/sewer" "/services/plumbing" "/services/water-heater" "/contact" "/columbus"; do
              attempt=1
              max_attempts=3
              healthy=0
              while [ "$attempt" -le "$max_attempts" ]; do
                code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${path}") || code="000"
                if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                  echo "OK: ${path} returned ${code}"
                  healthy=1
                  break
                fi
                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep 3
                fi
                attempt=$((attempt + 1))
              done
              if [ "$healthy" -eq 0 ]; then
                echo "UNHEALTHY: ${path} returned ${code}"
                FAILED=1
              fi
            done
            if [ "$FAILED" -eq 1 ]; then
              echo "Health check FAILED - one or more pages are not healthy"
              exit 1
            fi
            echo "All 5 pages healthy"

            # -- Brief 147 (Track A): CONTENT check, not just a status code --------
            # A 200 was never the question. /gas-lines returned 200 for the whole
            # Brief 146 release while rendering no copy at all, because the route had
            # been repointed at a CMS row the seed step never filled. Nothing in this
            # pipeline looked at what came back, so marketing found it instead of us.
            #
            # These are content markers: a page that 200s with the marker missing is a
            # FAILURE. Keep them to strings that are approved, stable copy - never a
            # heading Marketing is still iterating on. If Marketing rewords one of
            # these headings, update the marker here in the same change.
            echo ''
            echo '=============== CONTENT MARKER CHECKS ==============='
            CONTENT_FAILED=0
            CHECKS_RUN=0
            CHECKS_WARNED=0
            # Fetch a page and decode the HTML entities a browser would render, so a
            # marker can be written as the copy Marketing actually sees rather than as
            # escaped HTML source.
            #
            # `&` is the trap that made this necessary (Brief 149 follow-up). React
            # renders the heading "More Drain & Sewer Solutions" into the markup as
            # "More Drain &amp; Sewer Solutions", so a marker containing a literal `&`
            # matched ZERO times and failed a deploy over copy that was present and
            # correct. Decoding here fixes the whole class: `&`, apostrophes and
            # quotes in any future marker now behave the way whoever writes them
            # expects. `&amp;` is decoded LAST so an escaped entity like `&amp;quot;`
            # is not double-decoded into `"`.
            fetch_text() {
              curl -s --max-time 20 "http://localhost:3000${1}" \
                | sed -e 's/&quot;/"/g' \
                      -e "s/&#0*39;/'/g" \
                      -e "s/&#x0*27;/'/g" \
                      -e 's/&nbsp;/ /g' \
                      -e 's/&amp;/\&/g'
            }
            # A string that MUST be present. severity=fail blocks the deploy.
            # ── Content checks: assert INVARIANTS, never editorial wording ─────
            #
            # These used to pin exact strings — `check_h1 "/columbus" "Columbus
            # Plumber"`, `check_marker "/" "1387 W. Goodale Blvd"`, and three
            # headings each on /gas-lines, /sewer-rodding and /hydro-jetting. Every
            # one of those strings is a field Marketing owns in the CMS, so editing
            # copy turned the pipeline red: the Columbus H1 broke permanently the
            # moment somebody set a real headline ("PLUMBERS IN COLUMBUS, OHIO"),
            # and correcting the Columbus office address in /admin/global-settings
            # would have hard-failed a deploy. Twelve tripwires on ordinary
            # editorial work, four of them blocking.
            #
            # A gate that fires on legitimate content edits is worse than no gate,
            # because a red run stops carrying information and everyone learns to
            # ignore it. So the assertions moved to what is actually invariant.
            #
            # STILL CAUGHT — which is what Briefs 146/155/158 were reaching for:
            # a blank or degraded page (Brief 146 shipped one that rendered as
            # heading + image with no content), a missing or duplicated <h1>, an
            # unpublished CMS row, and leaked outline labels ("H1:" / "H2:" — Brief
            # 155 had to strip 43 of those out of live copy).
            #
            # NO LONGER CAUGHT, deliberately: the exact wording of any sentence.
            # That is Marketing's to change without consulting the pipeline.

            # Artefacts that mean the renderer or the copy is broken regardless of
            # wording. One definition so both checks agree.
            LEAKED_ARTEFACTS='^H[1-6]:|\{\{|\}\}|\[object Object\]|^undefined$|^null$'

            # Structural H1 check. `$2` is a word the heading must MENTION — the
            # city or service name — not a string it must equal.
            check_h1() {
              path="$1"; must_mention="$2"
              LAST_CHECK="check_h1 $path :: mentions $must_mention"
              CHECKS_RUN=$((CHECKS_RUN + 1))
              # Name the cause explicitly if the one non-obvious tool this check
              # needs is missing, so a toolchain gap can never read as an H1 defect.
              if ! command -v awk >/dev/null 2>&1; then
                echo "CHECK CANNOT RUN: awk is not on PATH, so check_h1 cannot parse ${path}."
                echo "  This is a box/toolchain problem, NOT an H1 regression."
                CONTENT_FAILED=1
                return
              fi
              body=$(fetch_text "$path") || body=""
              h1_count=$(printf '%s' "$body" | grep -oE '<h1[[:space:]>]' | wc -l | tr -d '[:space:]')
              h1_text=$(printf '%s' "$body" | tr '\n' ' ' \
                | awk -F'<h1' 'NF>1{print $2}' \
                | sed -e 's/^[^>]*>//' -e 's|</h1>.*$||' -e 's/<[^>]*>//g' \
                | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              if [ "$h1_count" != "1" ]; then
                echo "H1 DEFECT: ${path} renders ${h1_count} <h1> element(s), expected exactly 1 (first was \"${h1_text}\")"
                CONTENT_FAILED=1
              elif [ -z "$h1_text" ]; then
                echo "H1 DEFECT: ${path} renders an EMPTY <h1>."
                echo "  On a city page the H1 comes from city_pages.hero_heading_line1 when that"
                echo "  column is non-empty; a whitespace-only value produces exactly this."
                CONTENT_FAILED=1
              elif printf '%s' "$h1_text" | grep -qE "$LEAKED_ARTEFACTS"; then
                echo "H1 DEFECT: ${path} renders <h1>${h1_text}</h1> - that contains a leaked"
                echo "  template artefact or outline label. Fix the CMS field, not this check."
                CONTENT_FAILED=1
              elif ! printf '%s' "$h1_text" | grep -qiF -- "$must_mention"; then
                echo "H1 DEFECT: ${path} renders <h1>${h1_text}</h1>, which does not mention"
                echo "  \"${must_mention}\" - so this page is probably showing another page's heading."
                echo "  NOTE: the WORDING is Marketing's to choose. This only asserts the subject."
                CONTENT_FAILED=1
              else
                echo "OK: ${path} renders exactly one <h1> mentioning \"${must_mention}\": \"${h1_text}\""
              fi
            }

            # "This page is substantive" - one <h1>, real prose, no leaked
            # artefacts. Replaces the exact-sentence markers on the CMS-driven
            # pages, and catches the failure they were actually aimed at: Brief 146
            # shipped a page that rendered as heading + image with no content,
            # which is what an unpublished or empty CMS row produces.
            #
            # PARAGRAPH COUNT, not character count. Counting visible text needs the
            # <script> blocks stripped, and Next.js serves the whole document on one
            # line, so `sed 's|<script.*</script>||'` matches from the first script
            # tag to the last and eats the entire body - measured, it left every
            # page reporting 1 character. `grep -o '<p[ >]'` cannot fail that way.
            #
            # Floor measured against production 2026-09-04: /gas-lines 33,
            # /locations 40, /hydro-jetting 40, /sewer-rodding 41, /columbus 53,
            # / 77. A floor of 12 leaves ~3x headroom on the thinnest real page
            # while still catching a stripped one, which has almost none. Raise it
            # only with fresh measurements - a floor set near the real value is how
            # this check becomes the next thing everyone ignores.
            check_page_substantive() {
              path="$1"; min_paras="$2"; severity="$3"
              LAST_CHECK="check_page_substantive $path ($severity) :: min ${min_paras} paragraphs"
              CHECKS_RUN=$((CHECKS_RUN + 1))
              body=$(fetch_text "$path") || body=""
              paras=$(printf '%s' "$body" | grep -oE '<p[[:space:]>]' | wc -l | tr -d '[:space:]')
              h1_count=$(printf '%s' "$body" | grep -oE '<h1[[:space:]>]' | wc -l | tr -d '[:space:]')
              problem=""
              if [ "$h1_count" != "1" ]; then
                problem="renders ${h1_count} <h1> element(s), expected 1"
              elif [ "$paras" -lt "$min_paras" ]; then
                problem="renders only ${paras} paragraph(s) (floor ${min_paras}) - the page is degraded, or its CMS row is empty or unpublished"
              elif printf '%s' "$body" | grep -qF '{{'; then
                problem="contains an unrendered template token ({{...}})"
              fi
              if [ -z "$problem" ]; then
                echo "OK: ${path} is substantive (${paras} paragraphs, one h1)"
              elif [ "$severity" = "warn" ]; then
                echo "WARNING: ${path} ${problem}"
                CHECKS_WARNED=$((CHECKS_WARNED + 1))
              else
                echo "CONTENT DEFECT: ${path} ${problem}"
                CONTENT_FAILED=1
              fi
            }

            # Literal-string check. KEPT, but only legitimate for strings that are
            # NOT CMS-editable. Every previous caller was editable, so it has no
            # callers today - left in place because the next genuinely static
            # marker (a hardcoded legal line, a route-level string) should use this
            # rather than inventing another one. Never point it at a CMS field.
            check_marker() {
              path="$1"; marker="$2"; severity="$3"
              LAST_CHECK="check_marker $path ($severity) :: $marker"
              CHECKS_RUN=$((CHECKS_RUN + 1))
              body=$(fetch_text "$path") || body=""
              if printf '%s' "$body" | grep -qF -- "$marker"; then
                echo "OK: ${path} contains \"${marker}\""
              elif [ "$severity" = "warn" ]; then
                echo "WARNING: ${path} is missing \"${marker}\" - that section is empty on the live page."
                CHECKS_WARNED=$((CHECKS_WARNED + 1))
              else
                echo "CONTENT MISSING: ${path} does not contain \"${marker}\""
                CONTENT_FAILED=1
              fi
            }
            # A string that must NOT be present - migration junk that would render as
            # real copy. A function rather than an inline `if ... grep` so both kinds of
            # check share one shape, one counter, and one `set -e`-safe construct.
            check_absent() {
              path="$1"; marker="$2"; label="$3"
              LAST_CHECK="check_absent $path :: $marker"
              CHECKS_RUN=$((CHECKS_RUN + 1))
              body=$(fetch_text "$path") || body=""
              if printf '%s' "$body" | grep -qF -- "$marker"; then
                echo "CONTENT JUNK: ${path} still renders the ${label}"
                CONTENT_FAILED=1
              else
                echo "OK: ${path} - no ${label}"
              fi
            }
            # Brief 158 (Track C): assert the page's <h1> ELEMENT, not just that a
            # string appears somewhere in the document.
            #
            # `check_marker "/columbus" "Columbus Plumber"` looked like an H1 check and
            # was not: that string appears 10 times on the page (<title>, og:title,
            # twitter:title, the hero image alt, RSC payload copies), so the H1 could
            # be rewritten to anything at all and the check would still pass. On a city
            # page the H1 is `city_pages.hero_heading_line1` when non-empty, which is
            # one field in the CMS - a silent H1 regression on an indexed page was one
            # accidental keystroke away with nothing in the pipeline looking.
            #
            # Extraction is deliberately tolerant of attributes and of inline markup
            # inside the heading: split at the first `<h1`, drop the rest of the open
            # tag, cut at `</h1>`, then strip any remaining tags. A heading whose shape
            # this cannot read yields a mismatch - a LOUD failure, never a silent pass.
            # /gas-lines renders from `sub_service_pages`, so a 200 does not imply
            # there is copy on the page - an unpublished or empty row still returns
            # 200 with a heading and nothing under it. This asserts the page is
            # substantive; it deliberately does NOT assert any heading's wording.
            check_page_substantive "/gas-lines" 12 "fail"
            # -- Brief 149: the two newly consolidated pages -----------------------
            # Same reasoning as /gas-lines above - these routes render from
            # `sub_service_pages` instead of a static file, so a 200 no longer implies
            # there is copy on the page.
            #
            # These used to assert three exact section headings each, under a comment
            # reading "If Marketing rewords one, update the marker here in the same
            # change." That coupling was the bug: it made ordinary copy edits break the
            # pipeline, and nobody remembers to edit a YAML marker when they retitle a
            # section in the admin. The substantive check catches the failure that
            # actually mattered - the consolidation dropping a section - without owning
            # anybody's words.
            check_page_substantive "/sewer-rodding" 12 "fail"
            # The Brief 145 D-4 junk must never reach a rendered page again.
            check_absent "/sewer-rodding" "aaaaaa" '"aaaaaa" placeholder heading'
            check_page_substantive "/hydro-jetting" 12 "fail"
            # Scraped WordPress nav text was in id 23's intro_body and would render as
            # body copy the moment that route flipped.
            check_absent "/hydro-jetting" "SCHEDULE A SERVICE SERVICES" "scraped WordPress nav text"
            # -- Brief 154: Columbus, OH office + city page ------------------------
            # /columbus is a NEW route (Track A/B) and the footer/JSON-LD office
            # directory is a NEW DB write (Track C) - both are exactly the "200 with
            # nothing on it" failure mode the markers above exist for. The H1 marker
            # catches the city page rendering with no content; the footer marker on
            # "/" catches the add-columbus-office.ts script silently not applying (a
            # NOT-APPLIED verdict in the DB SCRIPT VERDICTS block above would be the
            # same failure, but this proves the write actually reached what a
            # visitor sees).
            #
            # Brief 158 (Track C): the /columbus check is now an H1 assertion, not a
            # whole-document grep. `check_marker "/columbus" "Columbus Plumber"` passed
            # on ten separate occurrences of that string - <title>, og:title,
            # twitter:title, the hero image alt, RSC payload copies - only ONE of which
            # is the H1. So the exact regression Brief 158 Track A guards against (a
            # non-empty `city_pages.hero_heading_line1` silently replacing the H1 of an
            # indexed page) would have deployed green. This asserts the H1 element
            # specifically, and that there is exactly one of them (CLAUDE.md gotcha #3:
            # one H1 per page, and a linked phone number is never a heading).
            check_h1 "/columbus" "Columbus"
            check_page_substantive "/" 12 "fail"
            check_page_substantive "/locations" 12 "fail"

            # -- Brief 155: no leaked "H1:"/"H2:" outline label on a rendered heading --
            # A 200 was never the question here either - the page rendered fine, it just
            # had the literal string "H1: " sitting inside the visible headline. This is
            # a CONTENT-SHAPE check, not a fixed-string marker: it greps the fetched HTML
            # for the label pattern appearing right after any tag close (i.e. the start of
            # a real text node), so it would catch this defect on ANY page, not just the
            # four the DB script is known to have fixed today - a future leaked label ships
            # red instead of shipping quietly.
            check_no_leaked_heading_label() {
              path="$1"
              LAST_CHECK="check_no_leaked_heading_label $path"
              CHECKS_RUN=$((CHECKS_RUN + 1))
              body=$(fetch_text "$path") || body=""
              hit=$(printf '%s' "$body" | grep -oiE '>[[:space:]]*H[1-6][[:space:]]*[:.-][[:space:]]*[A-Za-z]' | head -1)
              if [ -n "$hit" ]; then
                echo "CONTENT JUNK: ${path} still renders a leaked heading label: \"${hit}\""
                CONTENT_FAILED=1
              else
                echo "OK: ${path} - no leaked H1:/H2: heading label"
              fi
            }
            # -- Brief 174: the Google Ads tag is actually IN the served page ------
            # NOT in the brief; added because this is the one failure this whole
            # brief exists to undo, and nothing in the pipeline was looking.
            #
            # The tags are NEXT_PUBLIC_*, inlined at BUILD time from the export
            # block in the deploy step. A value that lives only in the box's
            # untracked env file inlines as BLANK, and a blank ID is a deliberate
            # no-op in src/lib/analytics.ts - so the tag silently does not render
            # and every page still returns a healthy 200. That is exactly how this
            # site ran with all five tags dark from cutover until 2026-08-08, and
            # how AW-16486409650 came to count zero conversions.
            #
            # This asserts a TRACKING ID, never any wording, so it is not the kind
            # of gate that fires on ordinary editorial work (see the note above the
            # content checks). Reported BY NAME: the repo is public and Actions
            # logs are world-readable, so no ID value is ever echoed.
            #
            # If Marketing deliberately switches Google Ads off, this step goes red
            # on purpose - update the two names below in the same change.
            # The expected/retired accounts, held in variables so no ID value is
            # ever interpolated into an echoed message. These must stay in step
            # with the export block in the deploy step above and with
            # PRODUCTION_IDS in src/lib/analytics.ts.
            EXPECTED_ADS_ID='AW-16486409650'
            RETIRED_ADS_ID='AW-661617195'
            check_google_ads_tag() {
              path="$1"
              LAST_CHECK="check_google_ads_tag $path"
              CHECKS_RUN=$((CHECKS_RUN + 1))
              body=$(curl -s --max-time 20 "http://localhost:3000${path}") || body=""
              # Occurrence counts, not `grep -c`: Next serves the whole document on
              # one line, so a line count is 1 no matter how many matches there are.
              ads_cfg=$(printf '%s' "$body" | grep -oF "config', '${EXPECTED_ADS_ID}'" | wc -l | tr -d '[:space:]')
              boots=$(printf '%s' "$body" | grep -oF "gtag('js', new Date())" | wc -l | tr -d '[:space:]')
              problem=""
              if [ "$ads_cfg" -eq 0 ]; then
                problem="issues NO gtag config call for the expected Google Ads account. Most likely a BLANK NEXT_PUBLIC_GOOGLE_ADS_ID at build time (it is inlined by next build, NOT read at runtime), or NEXT_PUBLIC_TRACKING_DISABLED=1 on this box"
              elif [ "$ads_cfg" -gt 1 ]; then
                problem="issues ${ads_cfg} config calls for the same Google Ads account - one is correct"
              elif printf '%s' "$body" | grep -qF -- "$RETIRED_ADS_ID"; then
                problem="still renders the RETIRED Google Ads account that Brief 174 replaced - something reintroduced it"
              elif [ "$boots" -ne 1 ]; then
                problem="runs the gtag bootstrap ${boots} time(s), expected exactly 1 - a second base tag was pasted in instead of an extra config call"
              fi
              if [ -z "$problem" ]; then
                echo "OK: ${path} configures the expected Google Ads account exactly once, and not the retired one"
              else
                echo "TRACKING DEFECT: ${path} ${problem}."
                CONTENT_FAILED=1
              fi
            }
            check_google_ads_tag "/"
            check_google_ads_tag "/thank-you"

            check_no_leaked_heading_label "/tinley-park"
            check_no_leaked_heading_label "/ingalls-park"
            check_no_leaked_heading_label "/joliet/water-heater-repair"
            check_no_leaked_heading_label "/homer-glen/water-heater-installation"

            # Completion sentinel. Without it there is no way to tell a script that
            # crashed mid-way from a log whose tail was truncated - the ambiguity that
            # made the first failure of this step take longer to read than it should
            # have. If you do not see this line, the step did NOT finish.
            echo "content checks complete: ${CHECKS_RUN} run, ${CHECKS_WARNED} warning(s), CONTENT_FAILED=${CONTENT_FAILED}"
            if [ "$CONTENT_FAILED" -eq 1 ]; then
              echo ''
              echo 'Content marker check FAILED. The page is serving 200 with missing copy.'
              echo 'Check the DB SCRIPT VERDICTS block in the deploy step above: a'
              echo 'NOT-APPLIED line there is the most likely cause.'
              exit 1
            fi
            echo 'All content markers present.'
            echo '====================================================='

            # -- Brief 152 (Fix 3): LIVE SEO/routing validation --------------------
            # The build-time half of this runs as `prebuild`
            # (scripts/validate-sitemap.ts) and cannot see a database or a serving
            # app. This half can: it asserts every sitemap <loc> returns 200 AND
            # declares a canonical equal to itself, that robots.txt carries no
            # Disallow, that /admin + /api answer X-Robots-Tag: noindex while
            # /robots.txt and /sitemap.xml do not, and that the trailing-slash and
            # alias redirects each reach a 200 in exactly ONE hop.
            #
            # This is the check that /hoa-line-piping needed: it sat in sitemap.xml
            # returning 404 for weeks, and nothing in this pipeline looked.
            #
            # Runs against localhost:3000 (the app, not nginx) like the checks above.
            #
            # Brief 153 made /sitemap.xml a <sitemapindex>: the validator now walks
            # the index, fetches every child, and checks ~12,264 URLs' worth of
            # <loc> entries. Two sampling bounds keep the health check quick:
            #   --articles-sample       the 812 /knowledge-hub/* URLs
            #   --city-services-sample  the 11,160 /{city}/{service} URLs
            # Everything else (the 292 pages + city landings) is checked in FULL on
            # every run, samples are evenly spread across the whole list rather than
            # truncated, and the script prints exactly how many of each class it
            # skipped so a bounded run cannot read as full coverage. Pass 0 for all.
            #
            # A failure here is a real SEO defect and SHOULD be red. It runs after the
            # swap, so the new build is already serving — read the ✗ lines, fix, redeploy.
            echo ''
            echo '=============== SEO / ROUTING VALIDATION ==============='
            LAST_CHECK="SEO / ROUTING VALIDATION"
            # Fail LOUDLY and specifically if the script is not where we think it is,
            # rather than letting node print a raw "Cannot find module" stack trace that
            # reads like a code defect. This is the guard runs 78/79 needed.
            if [ ! -f scripts/validate-seo-routing.mjs ]; then
              echo "MISSING: $(pwd)/scripts/validate-seo-routing.mjs does not exist."
              echo "This step must run from the app directory (/var/www/jblanton) — check the cd above."
              exit 1
            fi
            node scripts/validate-seo-routing.mjs --base=http://localhost:3000 --articles-sample=60 --city-services-sample=40
            echo '======================================================='

            # -- Brief 159 (E2 item 4): CRITICAL-URL CANARY ------------------------
            # Brief 159 gave the CMS a real unpublish: an editor can now take a page
            # off the site from the sidebar, and the page then 404s and leaves the
            # sitemap. That is the intended behaviour and it is also, by construction,
            # one mis-click away from de-indexing a URL Google already ranks.
            #
            # This is a STATUS-CODE check, deliberately, and separate from the content
            # markers above: Brief 157 showed that a check_marker grep over a whole
            # document can pass while the page is wrong, and the failure mode here is
            # the opposite one — the page is not being served at all.
            #
            # The list is the site's spine plus one page from each layer a mis-click
            # could reach. Keep it SHORT and keep every entry a page that must never
            # be dark; a long list turns this into another content check.
            echo ''
            echo '=============== CRITICAL URL CANARY (Brief 159) ==============='
            LAST_CHECK="critical URL canary"
            CANARY_FAILED=0
            for path in "/" "/columbus" "/emergency-plumbing" "/sewer-rodding" "/evanston/water-heater-repair" "/services/plumbing"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "http://localhost:3000${path}") || code="000"
              if [ "$code" = "200" ]; then
                echo "OK: ${path} -> 200"
              else
                echo "CANARY FAILED: ${path} -> ${code} (expected 200)"
                echo "  If this is 404, the most likely cause is that the page was UNPUBLISHED in the CMS."
                echo "  Re-publish a version from the editor's Status row to bring it straight back."
                CANARY_FAILED=1
              fi
            done
            if [ "$CANARY_FAILED" -eq 1 ]; then
              echo 'Critical URL canary FAILED - a page that must never be dark is not returning 200.'
              exit 1
            fi
            echo 'All critical URLs healthy.'
            echo '==============================================================='

            # -- Brief 159 (E2 item 5): UNPUBLISHED-PAGE REPORT --------------------
            # Every page currently held in `draft`, named in the deploy summary.
            # Silence is how a page stays accidentally dark for a month, so the count
            # is printed on every deploy even when it is zero.
            #
            # The same script also asserts the Track D invariant — the derived
            # `status` column agrees with `page_drafts.is_published` everywhere. It
            # REPORTS drift rather than repairing it: whether a page should be live is
            # an editorial decision, not one to make silently in a deploy log.
            # `--warn-only` keeps drift from blocking a deploy that is otherwise fine;
            # the lines are loud and greppable ("STATUS INVARIANT DRIFT").
            echo ''
            echo '=============== UNPUBLISHED PAGES / STATUS INVARIANT ==============='
            LAST_CHECK="Brief 159 status invariant + unpublished-page report"
            if [ ! -f scripts/check-brief-159-status-invariant.ts ]; then
              echo "MISSING: $(pwd)/scripts/check-brief-159-status-invariant.ts does not exist."
              echo "This step must run from the app directory (/var/www/jblanton) - check the cd above."
              exit 1
            fi
            npx ts-node --project tsconfig.scripts.json -r tsconfig-paths/register \
              scripts/check-brief-159-status-invariant.ts --warn-only
            echo '==================================================================='
