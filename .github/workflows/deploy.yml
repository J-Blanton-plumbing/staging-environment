name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            sudo chown -R ec2-user:ec2-user /var/www/jblanton
            cd /var/www/jblanton
            git config --global --add safe.directory /var/www/jblanton
            git fetch origin
            git reset --hard origin/main
            npm ci
            rm -rf /var/www/jblanton/.next
            npm run build
            pm2 restart jblanton --update-env

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            sleep 5
            FAILED=0
            for path in "/" "/services/sewer" "/services/plumbing" "/services/water-heater" "/contact"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${path}" || echo "000")
              if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
                echo "UNHEALTHY: ${path} returned ${code}"
                FAILED=1
              else
                echo "OK: ${path} returned ${code}"
              fi
            done
            if [ "$FAILED" -eq 1 ]; then
              echo "Health check FAILED - one or more pages are not healthy"
              exit 1
            fi
            echo "All 5 pages healthy"
